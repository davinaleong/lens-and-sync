name: lens-and-sync

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lens_and_sync_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  drive-sync:
    build:
      context: ..
      dockerfile: apps/drive-sync/Dockerfile
    env_file:
      - ../apps/drive-sync/.env
    ports:
      - "4001:4001"
    depends_on:
      - postgres

  dish-lens:
    build:
      context: ..
      dockerfile: apps/dish-lens/Dockerfile
    env_file:
      - ../apps/dish-lens/.env
    ports:
      - "4002:4002"
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  redis-data:
